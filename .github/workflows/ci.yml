name: CampusPrint CI/CD
 
# CI builds, tests, and pushes the image to Docker Hub.
# Deployment is NOT done from CI: an in-cluster updater (Keel, once installed)
# pulls new images. Until it is installed, pushes will not update the running app.
 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
 
permissions:
  contents: read
 
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
 
      - name: Install dependencies
        run: bun install --frozen-lockfile
 
      - name: TypeScript check
        run: bun run lint
 
      - name: Build frontend
        run: bun run build
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Validate Docker image build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: campusprint:ci-test
 
  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Serialize publishes so an older build can never overwrite a newer :latest
    concurrency:
      group: publish-image
      cancel-in-progress: false
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Build and push CampusPrint image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/campusprint:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/campusprint:${{ github.sha }}
 
