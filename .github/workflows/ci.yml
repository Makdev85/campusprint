name: CampusPrint CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campusprint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # STAGE 1: BUILD AND TEST
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run lint

      - name: Build frontend
        run: bun run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker image build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: campusprint:ci-test

  # STAGE 2: PUBLISH TO DOCKER HUB
  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push CampusPrint image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/campusprint:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/campusprint:${{ github.sha }}

  # STAGE 3: DEPLOY TO AWS EKS
  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::596717728680:role/CampusPrintGitHubActionsDeployRole
          aws-region: us-east-1

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0

      - name: Allow runner IP, deploy and restore EKS allowlist
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          set -Eeuo pipefail

          CLUSTER="campusprint-eks"
          REGION="us-east-1"
          NAMESPACE="default"
          DEPLOYMENT="campusprint"
          IMAGE="${DOCKERHUB_USERNAME}/campusprint:${GITHUB_SHA}"

          ORIGINAL_FILE="/tmp/eks-original.json"
          UPDATED_FILE="/tmp/eks-updated.json"
          UPDATE_ID=""
          RESTORE_REQUIRED=false

          wait_for_update() {
            local update_id="$1"

            for attempt in $(seq 1 60); do
              local status
              status=$(aws eks describe-update \
                --name "$CLUSTER" \
                --region "$REGION" \
                --update-id "$update_id" \
                --query 'update.status' \
                --output text)

              echo "EKS update status: $status"

              case "$status" in
                Successful) return 0 ;;
                Failed)
                  echo "EKS update failed."
                  return 1
                  ;;
              esac

              sleep 20
            done

            echo "Timed out waiting for EKS update."
            return 1
          }

          restore_allowlist() {
            echo "Checking whether original allowlist needs restoration..."

            aws eks describe-cluster \
              --name "$CLUSTER" \
              --region "$REGION" \
              --query 'cluster.resourcesVpcConfig' \
              --output json > /tmp/eks-current.json

            jq '{
              endpointPublicAccess: .endpointPublicAccess,
              endpointPrivateAccess: .endpointPrivateAccess,
              publicAccessCidrs: (.publicAccessCidrs | sort)
            }' /tmp/eks-current.json > /tmp/current-normalized.json

            jq '{
              endpointPublicAccess: .endpointPublicAccess,
              endpointPrivateAccess: .endpointPrivateAccess,
              publicAccessCidrs: (.publicAccessCidrs | sort)
            }' "$ORIGINAL_FILE" > /tmp/original-normalized.json

            if cmp -s /tmp/current-normalized.json /tmp/original-normalized.json; then
              echo "Original allowlist is already restored."
              return 0
            fi

            echo "Restoring original EKS allowlist..."

            local restore_id
            restore_id=$(aws eks update-cluster-config \
              --name "$CLUSTER" \
              --region "$REGION" \
              --resources-vpc-config "file://$ORIGINAL_FILE" \
              --query 'update.id' \
              --output text)

            wait_for_update "$restore_id"
          }

          cleanup() {
            local exit_code=$?
            trap - EXIT

            if [[ "$RESTORE_REQUIRED" == true ]]; then
              if [[ -n "$UPDATE_ID" ]]; then
                echo "Waiting for the initial EKS update to finish..."
                wait_for_update "$UPDATE_ID" || true
              fi

              restore_allowlist || {
                echo "::error::Could not restore original EKS allowlist."
                exit_code=1
              }
            fi

            exit "$exit_code"
          }

          trap cleanup EXIT

          # Get GitHub runner public IP.
          RUNNER_IP=$(curl -4fsS https://checkip.amazonaws.com | tr -d '\n')
          echo "GitHub runner IP: $RUNNER_IP"

          # Save original EKS endpoint settings.
          aws eks describe-cluster \
            --name "$CLUSTER" \
            --region "$REGION" \
            --query 'cluster.resourcesVpcConfig' \
            --output json > /tmp/eks-vpc.json

          jq '{
            endpointPublicAccess: .endpointPublicAccess,
            endpointPrivateAccess: .endpointPrivateAccess,
            publicAccessCidrs: .publicAccessCidrs
          }' /tmp/eks-vpc.json > "$ORIGINAL_FILE"

          # Add runner IP without removing existing IPs.
          jq --arg cidr "$RUNNER_IP/32" \
            '.publicAccessCidrs |= ((. + [$cidr]) | unique)' \
            "$ORIGINAL_FILE" > "$UPDATED_FILE"

          if ! cmp -s "$ORIGINAL_FILE" "$UPDATED_FILE"; then
            RESTORE_REQUIRED=true

            UPDATE_ID=$(aws eks update-cluster-config \
              --name "$CLUSTER" \
              --region "$REGION" \
              --resources-vpc-config "file://$UPDATED_FILE" \
              --query 'update.id' \
              --output text)

            wait_for_update "$UPDATE_ID"
          else
            echo "Runner IP is already allowlisted."
          fi

          # Connect to EKS.
          aws eks update-kubeconfig \
            --name "$CLUSTER" \
            --region "$REGION"

          # Deploy the exact published commit image.
          kubectl set image \
            "deployment/$DEPLOYMENT" \
            "campusprint=$IMAGE" \
            -n "$NAMESPACE"

          # Verify rollout.
          kubectl rollout status \
            "deployment/$DEPLOYMENT" \
            -n "$NAMESPACE" \
            --timeout=5m

          echo "CampusPrint deployed successfully: $IMAGE"
          
# STAGE 4: SLACK NOTIFICATIONS
  notify-slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - publish
      - deploy
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:      
      - name: Send pipeline status to Slack
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: >
            {
              "text": "CampusPrint CI/CD — ${{ (needs.build-and-test.result == 'success' && needs.publish.result == 'success' && needs.deploy.result == 'success') && 'SUCCESS' || 'FAILED' }} (Repo: ${{ github.repository }} | Run: ${{ github.run_id }})"
            }
