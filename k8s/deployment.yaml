apiVersion: apps/v1
kind: Deployment
metadata:
  name: campusprint
  labels:
    app: campusprint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campusprint
  template:
    metadata:
      labels:
        app: campusprint
    spec:
      containers:
        - name: campusprint
          image: makdev85/campusprint:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
